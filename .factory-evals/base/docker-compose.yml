services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
    volumes:
      - taskdata:/data
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  taskdata:
