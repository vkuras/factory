services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: chores
      POSTGRES_USER: chores
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chores -d chores"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://chores:${POSTGRES_PASSWORD}@db:5432/chores
      NODE_OPTIONS: --max-old-space-size=160
      APP_FAKE_NOW: ${APP_FAKE_NOW:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 256m

  web:
    build: ./web
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 64m

volumes:
  db-data:
