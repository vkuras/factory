<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Haushalt</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>Aufgaben</h1>
      <form id="new-task">
        <input id="title" name="title" placeholder="Neue Aufgabe" maxlength="100" aria-label="Titel">
        <input id="due" name="dueDate" type="date" aria-label="Fällig am">
        <button type="submit">Hinzufügen</button>
      </form>
      <p id="error" role="alert" hidden></p>
      <ul id="tasks"></ul>
      <p id="empty" hidden>Keine offenen Aufgaben.</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
